name: Release

# Tag v1.2.3 (or v1.2.3-beta.1 for the beta channel) to release.
# Flow: goreleaser (binaries/tarballs/deb/rpm/docker, draft release) ->
# macOS DMG (sign+notarise) -> Windows installer + standalone binaries
# (Azure Artifact Signing via GitHub OIDC; signing failure fails the release)
# -> signed update manifests + refreshed checksums -> publish.
#
# Secrets used:
#   ETHER_UPDATE_PRIVATE_KEY  base64 ed25519 (cmd/ether-release-sign keygen)
#   ETHER_UPDATE_PUBLIC_KEY   base64 ed25519 public half (baked into builds)
#   ETHER_TMDB_BUNDLED_KEY    TMDB v3 API key baked into builds (catalogue)
#   MACOS_CERT_P12            base64 Developer ID .p12
#   MACOS_CERT_PASSWORD       its password
#   MACOS_SIGN_IDENTITY       "Developer ID Application: ... (TEAMID)"
#   NOTARY_APPLE_ID / NOTARY_TEAM_ID / NOTARY_PASSWORD
#
# Environment `release-signing` (tags `v*`, OIDC — no client secrets):
#   AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#   ARTIFACT_SIGNING_ENDPOINT / ARTIFACT_SIGNING_ACCOUNT / ARTIFACT_SIGNING_PROFILE

on:
  push:
    tags: ["v*"]

# Each job requests only what it uses.
permissions: {}

jobs:
  ci:
    name: Require successful CI for the release commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    # Main CI includes a 45-minute race suite; waiting less cancels the release.
    timeout-minutes: 90
    steps:
      - name: Wait for exact-commit CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          run=""
          for _attempt in $(seq 1 12); do
            run=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run" ]; then break; fi
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "::error::No main-branch CI run found for release commit $SHA"
            exit 1
          fi
          gh run watch "$run" --repo "$REPO" --interval 30 --exit-status

  certification:
    name: Recertify the client matrix for this minor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the published certification matrix
        run: go run ./scripts/certification-gate -tag "$GITHUB_REF_NAME"

  goreleaser:
    name: GoReleaser (binaries, packages, docker)
    needs: certification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # draft release
      packages: write # candidate images on ghcr.io
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require written release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          notes="release-notes/$RELEASE_TAG.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Write $notes with the major changes and upgrade notes before tagging."
            exit 1
          fi
      - id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "channel=beta" >> "$GITHUB_OUTPUT" ;; *) echo "channel=stable" >> "$GITHUB_OUTPUT" ;; esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install llvm-lipo (universal ffmpeg), qemu, docker
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq llvm
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No cache in release builds. v4 caches only when cache: is set;
          # v5 and later cache by default unless this is false.
          package-manager-cache: false
      # .goreleaser.yaml before.hooks runs scripts/build-web.sh before compiling binaries.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETHER_UPDATE_PUBLIC_KEY: ${{ secrets.ETHER_UPDATE_PUBLIC_KEY }}
          ETHER_TMDB_BUNDLED_KEY: ${{ secrets.ETHER_TMDB_BUNDLED_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goreleaser-dist
          path: dist/release/
          retention-days: 7

  macos:
    name: macOS Ether.app + DMG
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # attach the DMG
    env:
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    needs: goreleaser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Import Developer ID certificate
        if: env.HAS_MACOS_CERT == 'true'
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
      - name: Build + sign + notarise DMG
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
          COMMIT: ${{ github.sha }}
          ETHER_UPDATE_PUBLIC_KEY: ${{ secrets.ETHER_UPDATE_PUBLIC_KEY }}
          ETHER_TMDB_BUNDLED_KEY: ${{ secrets.ETHER_TMDB_BUNDLED_KEY }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          packaging/macos/build-app.sh
          packaging/macos/build-dmg.sh
      - name: Attach DMG to the (draft) release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: gh release upload "v$VERSION" "dist/Ether-$VERSION.dmg" --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: dist/Ether-*.dmg

  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release-signing
    permissions:
      contents: write # attach the installer and signed Windows archives
      id-token: write # Azure Artifact Signing OIDC
    needs: goreleaser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download GoReleaser dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: goreleaser-dist
          path: artifacts/goreleaser-dist
      - name: Install NSIS
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            $installed = @($candidates | Where-Object { Test-Path -LiteralPath $_ })
            # Chocolatey can return success after a feed timeout without
            # installing anything. Require the actual compiler as well.
            if ($LASTEXITCODE -eq 0 -and $installed.Count -gt 0) {
              Split-Path $installed[0] | Out-File -FilePath $env:GITHUB_PATH -Append
              & $installed[0] /VERSION
              if ($LASTEXITCODE -ne 0) { throw "NSIS compiler did not run" }
              exit 0
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds 10 }
          }
          throw "NSIS installation failed after three attempts"
      - name: Require release-signing environment variables
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          foreach ($name in @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "ARTIFACT_SIGNING_ENDPOINT",
            "ARTIFACT_SIGNING_ACCOUNT",
            "ARTIFACT_SIGNING_PROFILE"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required release-signing environment variable: $name"
            }
          }
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Stage installer and standalone Windows binaries
        shell: pwsh
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
          COMMIT: ${{ github.sha }}
          ETHER_UPDATE_PUBLIC_KEY: ${{ secrets.ETHER_UPDATE_PUBLIC_KEY }}
          ETHER_TMDB_BUNDLED_KEY: ${{ secrets.ETHER_TMDB_BUNDLED_KEY }}
        run: |
          packaging/windows/build-installer.ps1 -Version $env:VERSION -Phase Stage

          $standalone = Join-Path $PWD "dist\windows\standalone"
          if (Test-Path -LiteralPath $standalone) {
            Remove-Item -LiteralPath $standalone -Recurse -Force
          }
          New-Item -ItemType Directory -Force $standalone | Out-Null

          foreach ($arch in @("amd64", "arm64")) {
            $srv = @(Get-ChildItem -Path "artifacts\goreleaser-dist\ether_windows_${arch}*\ether.exe" -File)
            if ($srv.Count -ne 1) {
              throw "Expected exactly one GoReleaser server binary for windows/$arch, found $($srv.Count)"
            }
            Copy-Item -LiteralPath $srv[0].FullName -Destination (Join-Path $standalone "ether-windows-$arch.exe")

            $tray = @(Get-ChildItem -Path "artifacts\goreleaser-dist\ether-tray_windows_${arch}*\ether-tray.exe" -File)
            if ($tray.Count -ne 1) {
              throw "Expected exactly one GoReleaser tray binary for windows/$arch, found $($tray.Count)"
            }
            Copy-Item -LiteralPath $tray[0].FullName -Destination (Join-Path $standalone "ether-tray-windows-$arch.exe")
          }
      - name: Sign staged Windows binaries
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\windows\staging\ether.exe,${{ github.workspace }}\dist\windows\staging\ether-tray.exe,${{ github.workspace }}\dist\windows\standalone\ether-windows-amd64.exe,${{ github.workspace }}\dist\windows\standalone\ether-tray-windows-amd64.exe,${{ github.workspace }}\dist\windows\standalone\ether-windows-arm64.exe,${{ github.workspace }}\dist\windows\standalone\ether-tray-windows-arm64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          cache-dependencies: false
      - name: Build NSIS installer
        shell: pwsh
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          $env:Path += ";C:\Program Files (x86)\NSIS"
          packaging/windows/build-installer.ps1 -Version $env:VERSION -Phase Package
      - name: Sign NSIS installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\EtherSetup-${{ needs.goreleaser.outputs.version }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          cache-dependencies: false
      - name: Verify Authenticode signatures and stage signed release assets
        shell: pwsh
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          $cmd = Get-Command signtool.exe -ErrorAction SilentlyContinue
          $signtool = if ($cmd) { $cmd.Source } else {
            @(
              Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue
              Get-ChildItem -Path "$HOME\AppData\Local\ArtifactSigning\Microsoft.Windows.SDK.BuildTools\*\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue
            ) | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) { throw "signtool.exe not found on runner" }
          Write-Host "==> using signtool: $signtool"

          $signedFiles = @(
            "dist\windows\staging\ether.exe",
            "dist\windows\staging\ether-tray.exe",
            "dist\windows\standalone\ether-windows-amd64.exe",
            "dist\windows\standalone\ether-tray-windows-amd64.exe",
            "dist\windows\standalone\ether-windows-arm64.exe",
            "dist\windows\standalone\ether-tray-windows-arm64.exe",
            "dist\EtherSetup-$($env:VERSION).exe"
          )
          foreach ($rel in $signedFiles) {
            $full = (Resolve-Path -LiteralPath $rel).Path
            & $signtool verify /pa /v $full
            if ($LASTEXITCODE -ne 0) { throw "signtool verify /pa /v failed for $rel" }
            $auth = Get-AuthenticodeSignature -LiteralPath $full
            if ($auth.Status -ne "Valid") {
              throw "Get-AuthenticodeSignature status for $rel is $($auth.Status): $($auth.StatusMessage)"
            }
            if ($null -eq $auth.TimeStamperCertificate) {
              throw "Signed binary $rel is missing an RFC3161 timestamp certificate"
            }
            Write-Host "==> verified Valid + timestamped: $rel ($($auth.SignerCertificate.Subject))"
          }

          Add-Type -AssemblyName System.IO.Compression, System.IO.Compression.FileSystem
          $assets = Join-Path $PWD "dist\windows\release-assets"
          if (Test-Path -LiteralPath $assets) {
            Remove-Item -LiteralPath $assets -Recurse -Force
          }
          New-Item -ItemType Directory -Force $assets | Out-Null

          foreach ($arch in @("amd64", "arm64")) {
            Copy-Item -LiteralPath "dist\windows\standalone\ether-windows-$arch.exe" `
              -Destination (Join-Path $assets "ether-windows-$arch.exe")

            $zipName = "ether_$($env:VERSION)_windows_$arch.zip"
            $srcZip = Join-Path "artifacts\goreleaser-dist" $zipName
            if (-not (Test-Path -LiteralPath $srcZip)) { throw "Missing GoReleaser archive: $srcZip" }
            $dstZip = Join-Path $assets $zipName
            Copy-Item -LiteralPath $srcZip -Destination $dstZip -Force

            $zip = [IO.Compression.ZipFile]::Open((Resolve-Path -LiteralPath $dstZip).Path, [IO.Compression.ZipArchiveMode]::Update)
            try {
              foreach ($pair in @(
                @{ Entry = "ether.exe"; Signed = "dist\windows\standalone\ether-windows-$arch.exe" },
                @{ Entry = "ether-tray.exe"; Signed = "dist\windows\standalone\ether-tray-windows-$arch.exe" }
              )) {
                $existing = $zip.GetEntry($pair.Entry)
                if (-not $existing) { throw "Archive $zipName missing expected entry $($pair.Entry)" }
                $existing.Delete()
                [IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                  $zip,
                  (Resolve-Path -LiteralPath $pair.Signed).Path,
                  $pair.Entry,
                  [IO.Compression.CompressionLevel]::Optimal
                ) | Out-Null
              }
            } finally {
              $zip.Dispose()
            }
          }
      - name: Smoke-test installed service and desktop launcher
        shell: pwsh
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: packaging/windows/smoke-installer.ps1 -Version $env:VERSION
      - name: Attach installer and signed Windows archives to the (draft) release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          set -eu
          gh release upload "v$VERSION" \
            "dist/EtherSetup-$VERSION.exe" \
            "dist/windows/release-assets/ether_${VERSION}_windows_amd64.zip" \
            "dist/windows/release-assets/ether_${VERSION}_windows_arm64.zip" \
            --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/EtherSetup-*.exe
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-binaries
          path: dist/windows/release-assets/
          retention-days: 7

  update-feed:
    concurrency:
      group: ether-update-feed
      cancel-in-progress: false
    name: Signed update manifests + publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # publish the release and manifests
      packages: write # promote approved images
    # The owner approves publication after testing the built release on a
    # real device; until then the GitHub release stays a draft and no update
    # channel moves. Approval: Actions run -> Review deployments.
    environment: release-publish
    env:
      HAS_UPDATE_KEY: ${{ secrets.ETHER_UPDATE_PRIVATE_KEY != '' }}
    needs: [ci, certification, goreleaser, macos, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Stage bare binaries and refresh checksums
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
        run: |
          set -euo pipefail
          # Stage the bare binaries under unique names: the manifest's
          # "binary" artifacts must resolve to exactly the bytes that were
          # hashed (a bare executable), so they are attached to the release
          # alongside the tarballs (see the attach step).
          mkdir -p feed
          b() { find artifacts/goreleaser-dist -path "*$1_$2*/$3" | head -n1; }
          stage() { # goos goarch srcname dstname
            src=$(b "$1" "$2" "$3")
            if [ -n "$src" ] && [ -f "$src" ]; then
              cp "$src" "feed/$4"
              echo "staged $4 <- $src"
            else
              echo "::error::no bare binary for $1/$2"
              exit 1
            fi
          }
          stage linux amd64 ether ether-linux-amd64
          stage linux arm64 ether ether-linux-arm64
          # goreleaser names the universal dir ether_darwin_all
          stage darwin all ether ether-darwin-universal

          # Windows bare binaries come from the windows job after Azure Artifact Signing,
          # never from the unsigned goreleaser-dist directories.
          for arch in amd64 arm64; do
            src="artifacts/windows-binaries/ether-windows-$arch.exe"
            if [ ! -f "$src" ]; then
              echo "::error::missing signed Windows binary: $src"
              exit 1
            fi
            cp "$src" "feed/ether-windows-$arch.exe"
            echo "staged ether-windows-$arch.exe <- $src (signed)"
          done

          # Re-derive checksums.txt so GoReleaser's Windows zip digests reflect
          # the signed binaries and every attached installer / standalone binary
          # has an entry matching the published bytes.
          grep -v '_windows_.*\.zip$' artifacts/goreleaser-dist/checksums.txt > checksums.raw
          for f in \
            "artifacts/windows-binaries/ether_${VERSION}_windows_amd64.zip" \
            "artifacts/windows-binaries/ether_${VERSION}_windows_arm64.zip" \
            "artifacts/macos-dmg/Ether-${VERSION}.dmg" \
            "artifacts/windows-installer/EtherSetup-${VERSION}.exe" \
            feed/ether-darwin-universal \
            feed/ether-linux-amd64 \
            feed/ether-linux-arm64 \
            feed/ether-windows-amd64.exe \
            feed/ether-windows-arm64.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::missing release artifact for checksums.txt: $f"
              exit 1
            fi
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            printf '%s  %s\n' "$sha" "$(basename "$f")" >> checksums.raw
          done
          LC_ALL=C sort -k2,2 -u checksums.raw > checksums.txt
          rm -f checksums.raw
          cat checksums.txt
      - name: Build + sign channel manifest
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          ETHER_UPDATE_PRIVATE_KEY: ${{ secrets.ETHER_UPDATE_PRIVATE_KEY }}
          ETHER_UPDATE_PUBLIC_KEY: ${{ secrets.ETHER_UPDATE_PUBLIC_KEY }}
          ETHER_TMDB_BUNDLED_KEY: ${{ secrets.ETHER_TMDB_BUNDLED_KEY }}
          VERSION: ${{ needs.goreleaser.outputs.version }}
          CHANNEL: ${{ needs.goreleaser.outputs.channel }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          base="https://github.com/$REPO/releases/download/v$VERSION"
          notes="https://github.com/$REPO/releases/tag/v$VERSION"
          args=()
          add() { # file os arch kind url
            if [ -f "$1" ]; then
              args+=(-artifact "$1:$2:$3:$4:$5")
            else
              echo "::error::missing artifact for $2/$3 ($1)"
              exit 1
            fi
          }
          add feed/ether-linux-amd64          linux   amd64     binary    "$base/ether-linux-amd64"
          add feed/ether-linux-arm64          linux   arm64     binary    "$base/ether-linux-arm64"
          add feed/ether-darwin-universal     darwin  universal binary    "$base/ether-darwin-universal"
          add feed/ether-windows-amd64.exe    windows amd64     binary    "$base/ether-windows-amd64.exe"
          add feed/ether-windows-arm64.exe    windows arm64     binary    "$base/ether-windows-arm64.exe"
          add "artifacts/macos-dmg/Ether-$VERSION.dmg"              darwin  universal installer "$base/Ether-$VERSION.dmg"
          add "artifacts/windows-installer/EtherSetup-$VERSION.exe" windows amd64     installer "$base/EtherSetup-$VERSION.exe"
          # Staged rollout: automatic installs spread over 24h on stable,
          # none on beta (ether-release-sign defaults). A security fix is
          # marked in its release notes with the line
          #   <!-- ether-update: critical -->
          # and then installs everywhere at the next quiet moment.
          rollout=()
          if grep -qs '<!-- ether-update: critical -->' "release-notes/v$VERSION.md"; then
            rollout=(-critical)
            echo "::notice::critical update: no staged rollout, installs at the next quiet moment"
          fi
          go run ./cmd/ether-release-sign manifest \
            -version "$VERSION" -channel "$CHANNEL" -notes "$notes" \
            "${rollout[@]}" "${args[@]}" -out "$CHANNEL.json"
          go run ./cmd/ether-release-sign sign -in "$CHANNEL.json" -detached
          go run ./cmd/ether-release-sign verify -in "$CHANNEL.json" -sig "$CHANNEL.json.sig"
          cat "$CHANNEL.json"
      # GoReleaser publishes only commit-specific candidate images. Public
      # version/latest tags move here, after CI and the publication approval.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote approved container images
        env:
          VERSION: ${{ needs.goreleaser.outputs.version }}
          CHANNEL: ${{ needs.goreleaser.outputs.channel }}
        run: |
          set -eu
          image=ghcr.io/braedonsaunders/ether
          commit=$(git rev-parse HEAD)
          for arch in amd64 arm64; do
            docker buildx imagetools create --tag "$image:$VERSION-$arch" "$image:candidate-$commit-$arch"
            if [ "$CHANNEL" = stable ]; then
              docker buildx imagetools create --tag "$image:latest-$arch" "$image:candidate-$commit-$arch"
            fi
          done
          docker buildx imagetools create --tag "$image:$VERSION" "$image:candidate-$commit"
          if [ "$CHANNEL" = stable ]; then
            docker buildx imagetools create --tag "$image:latest" "$image:candidate-$commit"
          fi
      - name: Attach manifest + publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.goreleaser.outputs.version }}
          CHANNEL: ${{ needs.goreleaser.outputs.channel }}
        run: |
          set -eu
          notes="release-notes/v$VERSION.md"
          test -s "$notes"
          gh release edit "v$VERSION" --notes-file "$notes"
          gh release upload "v$VERSION" checksums.txt feed/ether-* --clobber
          if [ -f "$CHANNEL.json" ]; then
            gh release upload "v$VERSION" "$CHANNEL.json" "$CHANNEL.json.sig" --clobber
          else
            echo "::warning::ETHER_UPDATE_PRIVATE_KEY not set — publishing WITHOUT a signed update manifest. Tray update checks will find nothing."
          fi
          if [ "$CHANNEL" = "beta" ]; then
            gh release edit "v$VERSION" --draft=false --prerelease --latest=false
          else
            gh release edit "v$VERSION" --draft=false --latest
          fi
          # Only once the release (and so every artifact URL in the
          # manifest) is public: every channel's current manifest also lives
          # on the rolling "channels" pre-release, the updater's default
          # feed. releases/latest never points at a beta, so beta.json could
          # not be found there. Older installs still read stable.json from
          # releases/latest, which the upload above keeps serving.
          if [ -f "$CHANNEL.json" ]; then
            if ! gh release view channels >/dev/null 2>&1; then
              gh release create channels --prerelease --latest=false \
                --title "Update channels" \
                --notes "Signed update manifests for each channel, read by Ether's updater. Not a release; do not delete."
            fi
            gh release upload channels "$CHANNEL.json" "$CHANNEL.json.sig" --clobber
          fi
